<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="雨夜便利店街角微缩模型：Three.js 纯程序化生成，三渲二卡通渲染，可自由拖拽旋转缩放。" />
<title>雨夜便利店 · 街角微缩模型</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #04060b;
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #scene:active { cursor: grabbing; }
  /* 纯画面暗角，不含任何 UI 控件 */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(118% 88% at 50% 44%, rgba(0,0,0,0) 40%, rgba(3,5,10,0.58) 100%);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. 通用工具
   ============================================================ */
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeIO = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const pick = arr => arr[(Math.random() * arr.length) | 0];

/* ============================================================
   1. 渲染器 / 场景 / 相机 / 控制器
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const FOG_COLOR = 0x0a1220;
scene.fog = new THREE.Fog(FOG_COLOR, 26, 58);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 220);
camera.position.set(8.25, 6.2, 9.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.85, 0.95, -0.85);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.enablePan = false;
controls.minDistance = 7.5;
controls.maxDistance = 30;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.4;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.8;
controls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.46, 0.62, 0.9
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const world = new THREE.Group();
scene.add(world);

/* ============================================================
   2. 环境贴图（程序化夜空渐变）+ 背景
   ============================================================ */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#060a16');
  grad.addColorStop(0.36, '#122040');
  grad.addColorStop(0.52, '#1d3157');
  grad.addColorStop(0.62, '#0d1524');
  grad.addColorStop(1.0, '#04060a');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  // 几处远处城市光雾
  const warm = g.createRadialGradient(700, 300, 10, 700, 300, 260);
  warm.addColorStop(0, 'rgba(255,176,116,0.30)');
  warm.addColorStop(1, 'rgba(255,176,116,0)');
  g.fillStyle = warm; g.fillRect(0, 0, 1024, 512);
  const cool = g.createRadialGradient(280, 320, 10, 280, 320, 300);
  cool.addColorStop(0, 'rgba(96,168,255,0.24)');
  cool.addColorStop(1, 'rgba(96,168,255,0)');
  g.fillStyle = cool; g.fillRect(0, 0, 1024, 512);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const envTex = makeEnvTexture();
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromEquirectangular(envTex);
scene.environment = envRT.texture;
scene.background = envTex;
scene.backgroundIntensity = 0.72;
pmrem.dispose();

/* ============================================================
   3. 三渲二材质系统
   ============================================================ */
const GRADIENT_MAP = (() => {
  const data = new Uint8Array([70, 70, 70, 255, 140, 140, 140, 255, 205, 205, 205, 255, 255, 255, 255, 255]);
  const tex = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
})();

function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT_MAP, ...extra });
}

const MAT = {
  slab:        toon(0x131a29),
  slabBand:    toon(0x39445f),
  asphalt:     new THREE.MeshStandardMaterial({ color: 0x151b27, roughness: 0.3, metalness: 0.32, envMapIntensity: 1.1 }),
  sidewalk:    toon(0xffffff),
  curb:        toon(0x5b6379),
  gutter:      toon(0x272d3c),
  paint:       new THREE.MeshStandardMaterial({ color: 0x7d8a9e, roughness: 0.5, metalness: 0.06, emissive: 0x0d1622, emissiveIntensity: 0.12 }),
  paintYellow: toon(0xb5a068, { emissive: 0x2a2210, emissiveIntensity: 0.15 }),
  wall:        toon(0xdfd3bf),
  wallShade:   toon(0xc8bfae),
  wallDark:    toon(0x2b3446),
  panel:       toon(0xe8e6df),
  pillar:      toon(0x9ea8bd),
  metal:       new THREE.MeshStandardMaterial({ color: 0x9ba7bb, roughness: 0.34, metalness: 0.78, envMapIntensity: 1.2 }),
  metalDark:   new THREE.MeshStandardMaterial({ color: 0x4d5666, roughness: 0.42, metalness: 0.7, envMapIntensity: 1.0 }),
  dark:        toon(0x232a38),
  black:       toon(0x161c27),
  awning:      toon(0x1f5f57),
  awningEdge:  toon(0x123f3a),
  wood:        toon(0x8f7355),
  glass:       new THREE.MeshPhysicalMaterial({
                 color: 0xcfe6ff, metalness: 0, roughness: 0.09,
                 transparent: true, opacity: 0.07, side: THREE.DoubleSide,
                 envMapIntensity: 0.3, depthWrite: false
               }),
  glassFridge: new THREE.MeshPhysicalMaterial({
                 color: 0xd8ecff, metalness: 0, roughness: 0.08,
                 transparent: true, opacity: 0.09, side: THREE.DoubleSide,
                 envMapIntensity: 0.25, depthWrite: false
               }),
  neonWarm:    new THREE.MeshBasicMaterial({ color: 0xfff0d2 }),
  neonCool:    new THREE.MeshBasicMaterial({ color: 0xd6ecff }),
  concrete:    toon(0x6a7285),
  rubber:      toon(0x1b2029),
  red:         toon(0xb8443f),
  blue:        toon(0x3d6fa8),
  green:       toon(0x3f7f63)
};

/* 画布纹理工厂 */
function canvasTex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = opt.wrap || THREE.RepeatWrapping;
  if (opt.repeat) t.repeat.set(opt.repeat[0], opt.repeat[1]);
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 人行道铺装纹理 */
const pavementTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#414859';
  g.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const v = 0.92 + Math.random() * 0.16;
      g.fillStyle = `rgb(${(63 * v) | 0},${(70 * v) | 0},${(87 * v) | 0})`;
      g.fillRect(x * s + 1.5, y * s + 1.5, s - 3, s - 3);
      // 细碎斑点
      for (let i = 0; i < 26; i++) {
        g.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
        g.fillRect(x * s + Math.random() * s, y * s + Math.random() * s, 2, 2);
      }
    }
  }
  g.strokeStyle = 'rgba(24,29,40,0.85)';
  g.lineWidth = 3;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke();
    g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke();
  }
}, { repeat: [1, 1] });

/* 沥青纹理 */
const asphaltTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#161c29';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.75 ? 'rgba(150,168,196,0.10)' : 'rgba(4,7,12,0.35)';
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  for (let i = 0; i < 7; i++) {
    g.strokeStyle = 'rgba(6,9,15,0.5)';
    g.lineWidth = 1 + Math.random() * 2;
    g.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rand(-60, 60); y += rand(-60, 60); g.lineTo(x, y); }
    g.stroke();
  }
}, { repeat: [4, 4] });

/* 排水沟盖板纹理 */
const grateTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#222835';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#0b0f16';
  for (let i = 0; i < 8; i++) g.fillRect(10, 8 + i * 15, w - 20, 8);
  g.strokeStyle = '#3a4354';
  g.lineWidth = 4;
  g.strokeRect(2, 2, w - 4, h - 4);
}, { wrap: THREE.RepeatWrapping });

/* ============================================================
   4. 轮廓线（反向描边 + 法线外扩）
   ============================================================ */
const OL_CACHE = new Map();
function outlineMaterial(thick, color) {
  const key = thick.toFixed(3) + '|' + color;
  if (OL_CACHE.has(key)) return OL_CACHE.get(key);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uThick: { value: thick * 1.35 },
      uColor: { value: new THREE.Color(color) }
    },
    vertexShader: `
      uniform float uThick;
      void main() {
        vec3 p = position + normal * uThick;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      void main() { gl_FragColor = vec4(uColor, 1.0); }`,
    side: THREE.BackSide
  });
  OL_CACHE.set(key, mat);
  return mat;
}

function outline(m, thick = 0.016, color = 0x0b0f18) {
  if (!m.parent) return m;
  const o = new THREE.Mesh(m.geometry, outlineMaterial(thick, color));
  o.position.copy(m.position);
  o.quaternion.copy(m.quaternion);
  o.scale.copy(m.scale);
  o.castShadow = false;
  o.receiveShadow = false;
  m.parent.add(o);
  return m;
}

/* ============================================================
   5. 建模小工具
   ============================================================ */
function make(geo, mat, opt = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(opt.x || 0, opt.y || 0, opt.z || 0);
  m.rotation.set(opt.rx || 0, opt.ry || 0, opt.rz || 0);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  (opt.parent || world).add(m);
  if (opt.ol) outline(m, opt.ol, opt.olColor || 0x0b0f18);
  return m;
}
const box = (w, h, d, mat, opt = {}) => make(new THREE.BoxGeometry(w, h, d), mat, opt);
const cyl = (rt, rb, h, seg, mat, opt = {}) => make(new THREE.CylinderGeometry(rt, rb, h, seg), mat, opt);
const plane = (w, h, mat, opt = {}) => make(new THREE.PlaneGeometry(w, h), mat, opt);

function tubeBetween(a, b, r, mat, opt = {}) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r, r, len, 8);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = opt.cast !== false;
  m.receiveShadow = true;
  (opt.parent || world).add(m);
  if (opt.ol) outline(m, opt.ol, opt.olColor || 0x0b0f18);
  return m;
}

function sagWire(a, b, sag, mat, radius = 0.014) {
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.TubeGeometry(curve, 18, radius, 5, false);
  return make(geo, mat, { cast: false, recv: false });
}

/* 叠加发光贴片（湿地面反光 / 光池） */
const glowTex = canvasTex(256, 256, (g, w, h) => {
  const grad = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.32, 'rgba(255,255,255,0.42)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
});
glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;

function lightPool(x, z, rx, rz, color, opacity = 0.35, y = 0.02) {
  const mat = new THREE.MeshBasicMaterial({
    map: glowTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const m = plane(rx * 2, rz * 2, mat, { x, y, z, rx: -Math.PI / 2, cast: false, recv: false });
  m.renderOrder = 2;
  return m;
}

// 竖直拉伸的湿地反光条纹
const streakTex = canvasTex(64, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(255,255,255,0.95)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  // 横向柔化
  const side = g.createLinearGradient(0, 0, w, 0);
  side.addColorStop(0, 'rgba(0,0,0,1)');
  side.addColorStop(0.5, 'rgba(0,0,0,0)');
  side.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = side;
  g.fillRect(0, 0, w, h);
});
streakTex.wrapS = streakTex.wrapT = THREE.ClampToEdgeWrapping;

function wetStreak(x, z, w, len, color, opacity = 0.3, angle = 0) {
  const mat = new THREE.MeshBasicMaterial({
    map: streakTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const m = plane(w, len, mat, { x, y: 0.022, z: z + len * 0.5, rx: -Math.PI / 2, rz: angle, cast: false, recv: false });
  m.renderOrder = 3;
  return m;
}

/* ============================================================
   6. 布局常量
   ============================================================ */
const BX0 = -5.2, BX1 = -0.8;   // 建筑 x 范围
const BZ0 = -5.2, BZ1 = -0.6;   // 建筑 z 范围
const ROOF_Y = 3.06;
const SW_Y = 0.12;              // 人行道面高
const FLOOR_Y = 0.14;           // 店内地面
const CEIL_Y = 2.56;

/* ============================================================
   7. 底座与地面
   ============================================================ */
// 底座（可收藏模型感的厚底座 + 一圈亮边）
box(12, 0.9, 12, MAT.slab, { y: -0.45, ol: 0.022, olColor: 0x04060b });
box(12.08, 0.09, 12.08, MAT.slabBand, { y: -0.055, ol: 0.012, olColor: 0x05080f });

// 沥青路面（整块，人行道压在上面）
const roadMat = MAT.asphalt.clone();
roadMat.map = asphaltTex;
const roadMesh = make(new THREE.PlaneGeometry(12, 12), roadMat, { rx: -Math.PI / 2, y: 0.002, cast: false });
roadMesh.receiveShadow = true;

function pavementMaterial(rx, rz) {
  const t = pavementTex.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, rz);
  return new THREE.MeshStandardMaterial({
    map: t, color: 0xc9d2e2, roughness: 0.4, metalness: 0.12, envMapIntensity: 1.25
  });
}

// 人行道：南侧一段 + 东侧一段（L 形街角）
box(5.8, 0.12, 2.9, pavementMaterial(2.4, 1.2), { x: -0.6, y: 0.06, z: 0.85, ol: 0.014 });
box(3.1, 0.12, 3.4, pavementMaterial(1.3, 1.4), { x: 0.75, y: 0.06, z: -2.3, ol: 0.014 });

// 路缘石
box(5.8, 0.17, 0.18, MAT.curb, { x: -0.6, y: 0.085, z: 2.39, ol: 0.014 });
box(0.18, 0.17, 8.3, MAT.curb, { x: 2.39, y: 0.085, z: -1.85, ol: 0.014 });
// 转角圆角
cyl(0.2, 0.2, 0.17, 12, MAT.curb, { x: 2.39, y: 0.085, z: 2.39, ol: 0.014 });

// 排水沟（沿路缘的格栅）
function gutter(x, z, w, d, horizontal) {
  const t = grateTex.clone();
  t.needsUpdate = true;
  t.repeat.set(horizontal ? w / 0.6 : d / 0.6, 1);
  const m = new THREE.MeshBasicMaterial({ map: t, color: 0x8a94a8 });
  box(w, 0.02, d, MAT.gutter, { x, y: 0.012, z, cast: false });
  plane(horizontal ? w : 0.26, horizontal ? 0.26 : d, m, {
    x, y: 0.024, z, rx: -Math.PI / 2, rz: horizontal ? 0 : Math.PI / 2, cast: false, recv: false
  });
}
gutter(-0.6, 2.6, 5.8, 0.28, true);
gutter(2.6, -1.85, 0.28, 8.3, false);

// 斑马线（东侧街道，靠近路口）
const crossGroup = new THREE.Group();
world.add(crossGroup);
for (let i = 0; i < 5; i++) {
  const z = 0.55 + i * 0.4;
  box(3.2, 0.012, 0.26, MAT.paint, { x: 4.15, y: 0.012, z, parent: crossGroup, cast: false, recv: true });
}
// 停止线 + 中心虚线
box(2.6, 0.012, 0.16, MAT.paint, { x: 3.95, y: 0.012, z: 2.78, cast: false, recv: false });
for (let i = 0; i < 6; i++) {
  box(0.7, 0.012, 0.12, MAT.paintYellow, { x: -5.4 + i * 1.35, y: 0.012, z: 4.35, cast: false, recv: false });
}

// 店前停车场（西侧两格，车头朝店）
box(2.2, 0.05, 2.7, toon(0x252b3a), { x: -4.6, y: 0.025, z: 0.95, cast: false });
for (let i = 0; i < 3; i++) {
  box(0.07, 0.014, 2.1, MAT.paint, { x: -5.66 + i * 1.06, y: 0.055, z: 1.2, cast: false, recv: false });
}
for (let i = 0; i < 2; i++) {
  box(0.52, 0.11, 0.16, MAT.concrete, { x: -5.13 + i * 1.06, y: 0.1, z: 0.36, ol: 0.012 });
}

// 街边平行停车位（东侧路缘）
box(0.06, 0.012, 2.0, MAT.paint, { x: 3.42, y: 0.012, z: -2.3, cast: false, recv: false });
for (let i = 0; i < 3; i++) {
  box(0.86, 0.012, 0.06, MAT.paint, { x: 3.0, y: 0.012, z: -3.3 + i * 1.0, cast: false, recv: false });
}

// 路面井盖与栅格
[[-1.6, 3.5], [4.6, 4.2]].forEach(([x, z]) => {
  cyl(0.34, 0.34, 0.02, 16, toon(0x4a5468), { x, y: 0.014, z, cast: false });
  cyl(0.3, 0.3, 0.024, 16, toon(0x3b4457), { x, y: 0.016, z, cast: false });
});
box(0.9, 0.02, 0.5, toon(0x39404f), { x: 1.6, y: 0.014, z: 4.4, cast: false });

// 店后的碎石后场 + 围栏地
box(4.4, 0.08, 0.8, toon(0x2d3444), { x: -3.0, y: 0.04, z: -5.6, cast: false });

/* ---------- 积水（暗色水膜 + 涟漪挂点） ---------- */
const puddleAreas = [];
function puddle(x, z, rx, rz, rot = 0) {
  const geo = new THREE.CircleGeometry(1, 28);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x060d18, roughness: 0.015, metalness: 0.9,
    transparent: true, opacity: 0.92, envMapIntensity: 2.0

function buildInstanced(geo, list, mat) {
  if (!list.length) return null;
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  list.forEach((it, i) => {
    dummy.position.set(it.x, it.y, it.z);
    dummy.rotation.set(0, it.ry || 0, 0);
    dummy.scale.set(it.sx || 1, it.sy || 1, it.sz || 1);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    im.setColorAt(i, col.set(it.c));
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = false;
  im.receiveShadow = true;
  world.add(im);
  return im;
}

const RAIN_COUNT = 1900;
const RAIN_H = 9.2;
const rainGeo = new THREE.InstancedBufferGeometry();
const rainQuad = new THREE.PlaneGeometry(1, 1);
rainGeo.index = rainQuad.index;
rainGeo.setAttribute('position', rainQuad.attributes.position);
rainGeo.setAttribute('uv', rainQuad.attributes.uv);
{
  const offs = new Float32Array(RAIN_COUNT * 3);
  const rnds = new Float32Array(RAIN_COUNT * 2);
  for (let i = 0; i < RAIN_COUNT; i++) {
    offs[i * 3] = rand(-6.4, 6.4);
    offs[i * 3 + 1] = rand(0, RAIN_H);
    offs[i * 3 + 2] = rand(-6.4, 6.4);
    rnds[i * 2] = Math.random();
    rnds[i * 2 + 1] = Math.random();
  }
  rainGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offs, 3));
  rainGeo.setAttribute('aRand', new THREE.InstancedBufferAttribute(rnds, 2));
  rainGeo.instanceCount = RAIN_COUNT;
}
const rainMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uH: { value: RAIN_H },
    uWind: { value: 0.12 }
  },
  vertexShader: `
    attribute vec3 aOffset;
    attribute vec2 aRand;
    uniform float uTime;
    uniform float uH;
    uniform float uWind;
    varying float vFade;
    void main() {
      vec3 p = aOffset;
      float sp = 6.4 + aRand.x * 5.6;
      p.y = mod(p.y - uTime * sp, uH);
      p.x += (uH - p.y) * uWind * 0.35;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float len = 0.13 + aRand.y * 0.19;
      mv.x += position.x * 0.008;
      mv.y += position.y * len;
      gl_Position = projectionMatrix * mv;
      vFade = smoothstep(0.0, 1.0, p.y) * (1.0 - smoothstep(uH - 1.6, uH, p.y));
      if (p.x > -5.25 && p.x < -0.75 && p.z > -5.25 && p.z < -0.55 && p.y < 3.2) vFade = 0.0;
    }`,
  fragmentShader: `
    varying float vFade;
    void main() {
      float a = 0.10 * vFade;
      gl_FragColor = vec4(0.62, 0.78, 1.0, a);
    }`,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending
});
const rainMesh = new THREE.Mesh(rainGeo, rainMat);

/* ---------- 水面涟漪 / 雨滴溅射池 ---------- */
function ringPool(count, inner, outer, color) {
  const geo = new THREE.RingGeometry(inner, outer, 16);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const im = new THREE.InstancedMesh(geo, mat, count);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.frustumCulled = false;
  const white = new THREE.Color(1, 1, 1);
  for (let i = 0; i < count; i++) {
    im.setColorAt(i, white);
    im.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0));
  }
  im.instanceColor.needsUpdate = true;
  im.instanceMatrix.needsUpdate = true;
  world.add(im);
  return { mesh: im, items: [] };
}

const splashPool = ringPool(90, 0.55, 1.0, 0x7fa4c8);
for (let i = 0; i < 90; i++) {
  splashPool.items.push({ x: 0, z: 0, t: rand(0, 1), dur: rand(0.5, 0.85), size: rand(0.05, 0.13), on: false });
}
const ripplePool = ringPool(30, 0.82, 1.0, 0x7d9dc0);
for (let i = 0; i < 30; i++) {
  ripplePool.items.push({ x: 0, z: 0, t: rand(0, 1), dur: rand(1.3, 2.4), size: 0.4, on: false });
}

const splashDummy = new THREE.Object3D();
const splashColor = new THREE.Color();

function spawnSplash(x, z, size) {
  const it = splashPool.items.find(i => !i.on);
  if (!it) return;
  it.on = true; it.t = 0; it.x = x; it.z = z;
  it.size = size || rand(0.05, 0.14);
}

function spawnRipple() {
  const it = ripplePool.items.find(i => !i.on);
  if (!it) return;
  const a = pick(puddleAreas);
  const ang = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random());
  it.on = true; it.t = 0;
  it.x = a.x + Math.cos(ang) * a.rx * r * 0.85;
  it.z = a.z + Math.sin(ang) * a.rz * r * 0.85;
  it.size = rand(0.22, 0.5);
}

function updateRings(pool, dt) {
  const im = pool.mesh;
  pool.items.forEach((it, i) => {
    if (!it.on) { splashDummy.scale.setScalar(0); splashDummy.position.set(0, -5, 0); }
    else {
      it.t += dt / it.dur;
      if (it.t >= 1) { it.on = false; it.t = 1; }
      const k = 1 - it.t;
      const s = lerp(0.25, 1, it.t) * it.size;
      splashDummy.position.set(it.x, 0.03, it.z);
      splashDummy.scale.set(s, s, s);
      splashDummy.rotation.set(-Math.PI / 2, 0, 0);
      splashColor.setScalar(k * k * 0.45);
      im.setColorAt(i, splashColor);
    }
    splashDummy.updateMatrix();
    im.setMatrixAt(i, splashDummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
}

/* ---------- 雨丝沿着玻璃流下 ---------- */
function makeGlassRainTexture() {
  return canvasTex(256, 512, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    for (let i = 0; i < 64; i++) {
      const x = Math.random() * w;
      const len = rand(50, 210);
      const y = Math.random() * h;
      const grad = g.createLinearGradient(0, y - len, 0, y + 10);
      grad.addColorStop(0, 'rgba(200,230,255,0)');
      grad.addColorStop(0.75, 'rgba(205,232,255,0.55)');
      grad.addColorStop(1, 'rgba(230,245,255,0.08)');
      g.fillStyle = grad;
      g.fillRect(x, y - len, rand(1.2, 3.2), len);
    }
    for (let i = 0; i < 130; i++) {
      g.fillStyle = `rgba(215,238,255,${rand(0.12, 0.5)})`;
      g.beginPath();
      g.arc(rand(0, w), rand(0, h), rand(0.7, 2.6), 0, Math.PI * 2);
      g.fill();
    }
  }, { wrap: THREE.RepeatWrapping });
}

const dripGeo = new THREE.SphereGeometry(0.021, 6, 6);

function resetDrip(d) {
  if (Math.random() < 0.68) {
    d.x = rand(-4.9, -1.2);
    d.z = 0.26;
    d.y = 2.34;
  } else {
    d.x = 0.1;
    d.z = rand(-4.9, -0.9);

  d.active = true;

/* ---------- 店内灯光轻微闪烁 + 招牌灯箱闪烁 ---------- */
const flickerState = { sign: 1, next: 2.2, burst: 0, light: 1, nextL: 5.4, burstL: 0 };

/* ============================================================
   13. 动效调度与主循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let frames = 0;

/* ---- 自动门 ---- */
const door = { state: 'closed', timer: 4.5, amount: 0 };
function updateDoor(dt) {
  door.timer -= dt;
  if (door.state === 'closed') {
    if (door.timer <= 0) door.state = 'opening';
  } else if (door.state === 'opening') {
    door.amount = Math.min(1, door.amount + dt / 0.62);
    if (door.amount >= 1) { door.state = 'open'; door.timer = rand(1.9, 3.1); }
  } else if (door.state === 'open') {
    if (door.timer <= 0) door.state = 'closing';
  } else {
    door.amount = Math.max(0, door.amount - dt / 0.85);
    if (door.amount <= 0) { door.state = 'closed'; door.timer = rand(9, 15); }
  }
  const e = easeIO(door.amount);
  doorL.position.x = -1.7 - 0.47 * e;
  doorR.position.x = -1.22 + 0.47 * e;
  lightDoor.intensity = 1.0 + 0.7 * e;
  poolDoor.material.opacity = 0.36 + 0.2 * e;
}

/* ---- 招牌 / 灯箱闪烁 ---- */
const flicker = { a: 1, ta: rand(2, 5), burstA: 0, b: 1, tb: rand(6, 11), burstB: 0 };
function updateFlicker(dt) {
  flicker.ta -= dt;
  if (flicker.ta <= 0) {
    flicker.burstA = rand(0.05, 0.14);
    flicker.ta = Math.random() < 0.4 ? rand(0.1, 0.55) : rand(4, 10);
  }
  if (flicker.burstA > 0) { flicker.burstA -= dt; flicker.a = rand(0.5, 1); }
  else flicker.a = 0.92 + Math.sin(elapsed * 2.1) * 0.03;
  signFaceS.material.color.setScalar(flicker.a);
  signFaceE.material.color.setScalar(flicker.a * 0.97);
  poolSignS.material.opacity = 0.22 * (0.55 + 0.45 * flicker.a);
  streakSignS.material.opacity = 0.13 * (0.5 + 0.5 * flicker.a);

  flicker.tb -= dt;
  if (flicker.tb <= 0) {
    flicker.burstB = rand(0.05, 0.2);
    flicker.tb = rand(9, 18);
  }
  if (flicker.burstB > 0) { flicker.burstB -= dt; flicker.b = rand(0.35, 1); }
  else flicker.b = 0.86 + Math.sin(elapsed * 1.3 + 1.7) * 0.03;
  cornerSignMats.color.setScalar(flicker.b);
}

/* ---- 远处信号灯 ---- */
const CYCLE = 16.5;
function updateTraffic(dt) {
  const t = elapsed % CYCLE;
  let active = 0;
  if (t < 7.5) active = 0;
  else if (t < 9.6) active = 1;
  else active = 2;
  traffic.lamps.forEach((l, i) => {
    const on = i === active;
    l.mesh.material.color.copy(l.base).multiplyScalar(on ? 1 : 0.06);
  });
  const gCol = traffic.lamps[active].base.clone().multiplyScalar(0.85);
  traffic.glow.material.color.copy(gCol);
  traffic.glow.material.opacity = 0.09 + 0.04 * Math.sin(elapsed * 3);
}

/* ---- 雨滴 / 涟漪 ---- */
let splashAcc = 0, rippleAcc = 0;
function updateWeather(dt) {
  rainMat.uniforms.uTime.value = elapsed;
  glassRainA.offset.y -= dt * 0.075;
  glassRainB.offset.y -= dt * 0.055;

  // 溅射
  splashAcc += dt;
  const need = Math.min(6, Math.floor(splashAcc / 0.011));
  for (let i = 0; i < need; i++) {
    splashAcc -= 0.011;
    spawnSplash(rand(-5.8, 5.8), rand(-2.6, 5.8), rand(0.04, 0.12));
  }
  if (splashAcc > 0.5) splashAcc = 0;
  updateRings(splashPool, dt);

  // 积水面涟漪
  rippleAcc += dt;
  if (rippleAcc > 0.16) { rippleAcc = 0; spawnRipple(); if (Math.random() < 0.4) spawnRipple(); }
  updateRings(ripplePool, dt);

  // 屋檐滴水
  drips.forEach(d => {
    if (!d.active) {
      d.delay -= dt;
      if (d.delay <= 0) resetDrip(d);
      return;
    }
    d.v += 9.4 * dt;
    d.y -= d.v * dt;
    d.mesh.position.set(d.x, d.y, d.z);
    d.mesh.scale.set(1, 1.6 + d.v * 0.18, 1);
    if (d.y <= 0.16) {
      d.active = false;
      d.mesh.visible = false;
      d.delay = rand(0.5, 3.0);
      spawnSplash(d.x, d.z, rand(0.06, 0.12));
    }
  });
}

/* ---- 主循环 ---- */
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateDoor(dt);
  updateFlicker(dt);
  updateTraffic(dt);
  updateWeather(dt);

  // 店内灯光的极轻呼吸
  lightIn1.intensity = 8.2 + Math.sin(elapsed * 1.7) * 0.35;
  lightIn2.intensity = 5.4 + Math.sin(elapsed * 2.3 + 0.9) * 0.25;

  controls.update();
  composer.render();

  frames++;
  if (frames === 3) window.__READY__ = true;
}
renderer.setAnimationLoop(animate);

/* ---- 自适应 ---- */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();
