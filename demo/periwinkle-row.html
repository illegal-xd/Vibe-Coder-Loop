  function moveToPoint(cxPos, cyPos) {
    const world = mode === 'hood' ? hoodWorld : homeWorld;
    const nav = mode === 'hood' ? navHood : navHome;
    const actor = mode === 'hood' ? hoodActor : homeActor;
    if (!nav || !actor.group) return false;
    const hit = floorPoint(cxPos, cyPos);
    if (!hit) return false;
    const local = world.worldToLocal(hit.clone());
    if (!nav.contains(local.x, local.z)) return false;
    const dest = walkActorTo(actor, nav, local.x, local.z);
    if (!dest) return false;
    actor.look = null;
    spawnMoveMarker(world, dest.x, dest.z);
    closeCard();
    return true;
  }

  function walkToInteraction(at, faceAt = null) {
    if (!at || mode === 'hood' || !navHome) return;
    walkActorTo(homeActor, navHome, at[0], at[2], faceAt || [at[0], 0, at[2]]);
  }

  function canPlace(kind, x, z, ignoreId) {
    const c = CATALOG[kind];
    if (!c) return false;
    const hw = c.w / 2, hd = c.d / 2;
    if (x - hw < -3.5 || x + hw > 3.5 || z - hd < -3.5 || z + hd > 3.5) return false;
    if (c.walkable) return true;
    for (const o of obstacles) {
      if (ignoreId && o.id === ignoreId) continue;
      if (Math.abs(x - o.x) < hw + o.w / 2 + 0.05 && Math.abs(z - o.z) < hd + o.d / 2 + 0.05) return false;
    }
    return true;
  }

  function spawnPlaced(entry) {
    const c = CATALOG[entry.kind];
    if (!c) return;
    const group = c.make();
    group.position.set(entry.x, 0, entry.z);
    group.userData.pick = { type: 'decor', id: entry.id };
    homeWorld.add(group);
    const rt = { group, light: group.userData.light, bulb: group.userData.bulb, on: true };
    if (rt.light) rt.light.intensity = 6.5;
    placedRuntime.set(entry.id, rt);
    if (!c.walkable) {
      obstacles.push({ id: entry.id, x: entry.x, z: entry.z, w: c.w, d: c.d });
    }
  }

  function startPlacing(kind, moveId = null) {
    const c = CATALOG[kind];
    if (!c) return;
    if (placing) cancelPlacing();
    if (mode !== 'build') setMode('build');
    if (moveId) {
      const rt = placedRuntime.get(moveId);
      if (rt) rt.group.visible = false;
    }
    const ghost = c.make();
    ghost.traverse((o) => {
      if (o.isMesh) {
        if (o.material && o.material.isShaderMaterial) {
          o.visible = false;
          return;
        }
        o.castShadow = false;
        o.receiveShadow = false;
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.42;
        o.material.depthWrite = false;
      }
    });
    ghost.position.set(0, -10, 0);
    homeWorld.add(ghost);
    const ring = new Mesh(new RingGeometry(0.5, 0.62, 32), new MeshBasicMaterial({
      color: 0x9fe0a8, transparent: true, opacity: 0.85, side: DoubleSide, depthWrite: false
    }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    homeWorld.add(ring);
    placing = { kind, moveId, ghost, ring, valid: false, x: 0, z: 0 };
    ui.buildName.textContent = c.name;
    ui.buildHint.hidden = false;
    ui.tip.hidden = true;
    closeCard();
    deselect();
    if (isNarrow()) closeSheet();
    renderShop();
  }

  function cancelPlacing() {
    if (!placing) return;
    homeWorld.remove(placing.ghost);
    homeWorld.remove(placing.ring);
    placing.ghost.traverse((o) => {
      if (o.isMesh) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      }
    });
    if (placing.moveId) {
      const rt = placedRuntime.get(placing.moveId);
      if (rt) rt.group.visible = true;
    }
    placing = null;
    ui.buildHint.hidden = true;
    renderShop();
  }

  function updateGhost(cx, cy) {
    if (!placing) return;
    const rect = canvas.getBoundingClientRect();
    pointer.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.ray.intersectPlane(groundPlane, scratch);
    if (!hit) return;
    const cat = CATALOG[placing.kind];
    const x = clamp(Math.round(hit.x * 4) / 4, -3.45, 3.45);
    const z = clamp(Math.round(hit.z * 4) / 4, -3.45, 3.45);
    placing.x = x;
    placing.z = z;
    placing.valid = canPlace(placing.kind, x, z, placing.moveId);
    placing.ghost.position.set(x, 0.01, z);
    placing.ring.position.set(x, 0.025, z);
    placing.ring.scale.set(Math.max(0.4, cat.w / 1.24), Math.max(0.4, cat.d / 1.24), 1);
    placing.ring.material.color.set(placing.valid ? 0x9fe0a8 : 0xff8a7a);
  }

  function tryPlaceAt(cx, cy) {
    if (!placing) return;
    updateGhost(cx, cy);
    const p = placing;
    const c = CATALOG[p.kind];
    if (!p.valid) {
      toast('这里放不下，换个位置试试', 'warn');
      return;
    }
    const x = p.x, z = p.z;
    if (p.moveId) {
      const entry = S.placed.find((it) => it.id === p.moveId);
      if (entry) {
        entry.x = x;
        entry.z = z;
        const rt = placedRuntime.get(entry.id);
        if (rt) {
          rt.group.position.set(x, 0, z);
          rt.group.visible = true;
        }
        const ob = obstacles.find((o) => o.id === entry.id);
        if (ob) { ob.x = x; ob.z = z; }
        rebuildHomeNav();
        toast(`已移动「${c.name}」`);
      }
    } else {
      if (S.coins < c.price) {
        toast(`🪙 金币不够，还差 ${c.price - S.coins}`, 'warn');
        cancelPlacing();
        return;
      }
      addCoins(-c.price, true);
      const id = uid();
      S.placed.push({ id, kind: p.kind, x, z });
      spawnPlaced({ id, kind: p.kind, x, z });
      rebuildHomeNav();
      S.today.tidy++;
      toast(`🪑 买下并摆放了「${c.name}」`);
    }
    cancelPlacing();
    burstAt([x, 0.7, z], 0xffca8a);
    renderShop();
    renderHUD();
    checkGoals();
    saveState('build');
  }

  function selectDecor(id) {
    if (mode !== 'build') return;
    if (selectedId === id) {
      deselect();
      return;
    }
    const entry = S.placed.find((p) => p.id === id);
    if (!entry) return;
    selectedId = id;
    const c = CATALOG[entry.kind];
    selRing.visible = true;
    selRing.position.set(entry.x, 0.03, entry.z);
    selRing.scale.set(Math.max(0.5, c.w / 1.2), Math.max(0.5, c.d / 1.2), 1);
    renderDecorOps();
    closeCard();
  }

  function deselect() {
    selectedId = null;
    if (selRing) selRing.visible = false;
    renderDecorOps();
  }

  function sellSelected() {
    const entry = S.placed.find((p) => p.id === selectedId);
    if (!entry) return;
    const c = CATALOG[entry.kind];
    const refund = Math.floor(c.price * 0.6);
    S.placed = S.placed.filter((p) => p.id !== entry.id);
    const rt = placedRuntime.get(entry.id);
    if (rt) {
      homeWorld.remove(rt.group);
      placedRuntime.delete(entry.id);
    }
    const i = obstacles.findIndex((o) => o.id === entry.id);
    if (i >= 0) obstacles.splice(i, 1);
    rebuildHomeNav();
    addCoins(refund, true);
    deselect();
    renderShop();
    renderHUD();
    saveState('build');
    toast(`♻️ 回收了「${c.name}」 · +${refund} 金币`);
  }

  function runDecorAction(id) {
    const entry = S.placed.find((p) => p.id === id);
    if (!entry) return;
    const c = CATALOG[entry.kind];
    const rt = placedRuntime.get(id);
    if (c.action === 'lamp') {
      walkToInteraction([entry.x, 1.0, entry.z]);
      if (rt && rt.light) {
        rt.on = !rt.on;
        rt.light.intensity = rt.on ? 6.5 : 0;
        if (rt.bulb) rt.bulb.material.color.set(rt.on ? 0xffe6b8 : 0x6b5a44);
      }
      burstAt([entry.x, 1.55, entry.z], 0xffca8a);
      toast(rt && rt.on ? '💡 暖灯亮起来了' : '💡 灯关上了');
      saveState('action');
      return;
    }
    const a = c.action ? ACTIONS[c.action] : null;
    if (!a) {
      toast('这是米莉喜欢的小角落。');
      return;
    }
    openCard({
      icon: a.icon, title: a.name, note: a.note, fx: a.fx || [],
      actions: [{
        label: '现在做', meta: a.cost ? `${a.cost} 金币` : '免费',
        disabled: !!(a.cost && S.coins < a.cost), primary: true,
        onclick: () => doAction(c.action, [entry.x, 1.05, entry.z])
      }]
    });
    walkToInteraction([entry.x, 1.05, entry.z]);
  }

  /* ============================================================
   * 12. 模式 / 镜头
   * ============================================================ */
  function openSheet() {
    ui.sidePanel.classList.add('open');
    ui.panelToggle.textContent = '✕';
    ui.panelToggle.setAttribute('aria-expanded', 'true');
    ui.panelToggle.setAttribute('aria-label', '关闭面板');
  }

  function closeSheet() {
    ui.sidePanel.classList.remove('open');
    ui.panelToggle.textContent = '☰';
    ui.panelToggle.setAttribute('aria-expanded', 'false');
    ui.panelToggle.setAttribute('aria-label', '打开面板');
  }

  function camPreset(m) {
    const portrait = window.innerWidth / window.innerHeight < 0.9;
    const off = m === 'hood' ? new Vector3(0, 0, -46) : new Vector3(0, 0, 0);
    if (m === 'hood') {
      if (portrait) {
        return { pos: new Vector3(10.5, 15.5, 26).add(off), target: new Vector3(0, 1.2, 0.5).add(off) };
      }
      const scale = window.innerHeight < 560 ? 1.18 : 1;
      return {
        pos: new Vector3(10.5 * scale, 15.2 * scale, 25.5 * scale).add(off),
        target: new Vector3(0, 1.2, 0.5).add(off)
      };
    }
    if (portrait) {
      return { pos: new Vector3(15.7, 16.5, 24.5), target: new Vector3(0, 1.5, 0) };
    }
    if (window.innerHeight < 560) {
      return { pos: new Vector3(13.7, 12.3, 17.2), target: new Vector3(0, 1.5, 0) };
    }
    return { pos: new Vector3(10.5, 9.4, 13.2), target: new Vector3(0, 1.5, 0) };
  }

  function flyTo(dest, dur = 880) {
    camTween = {
      fromPos: camera.position.clone(), toPos: dest.pos.clone(),
      fromTgt: controls.target.clone(), toTgt: dest.target.clone(),
      start: performance.now(), dur
    };
    controls.enabled = false;
  }

  function finishTween() {
    if (!camTween) return;
    camera.position.copy(camTween.toPos);
    controls.target.copy(camTween.toTgt);
    camTween = null;
    controls.enabled = true;
    controls.update();
  }

  function updateCamera() {
    if (camTween) {
      const k = Math.min(1, (performance.now() - camTween.start) / camTween.dur);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
      controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, e);
      if (k >= 1) finishTween();
    } else {
      controls.update();
    }
  }

  function orbit(rad) {
    const tgt = controls.target.clone();
    const off = camera.position.clone().sub(tgt).applyAxisAngle(new Vector3(0, 1, 0), rad);
    flyTo({ pos: tgt.clone().add(off), target: tgt }, 420);
  }

  function zoomBy(factor) {
    if (camTween) finishTween();
    const tgt = controls.target.clone();
    const off = camera.position.clone().sub(tgt);
    const dist = clamp(off.length() * factor, controls.minDistance, controls.maxDistance);
    flyTo({ pos: tgt.clone().add(off.normalize().multiplyScalar(dist)), target: tgt }, 300);
  }

  function setMode(next) {
    if (!['life', 'build', 'hood'].includes(next)) return;
    if (mode === next) {
      if (next === 'build' && isNarrow()) openSheet();
      return;
    }
    cancelPlacing();
    deselect();
    closeCard();
    mode = next;
    document.body.dataset.mode = next;
    homeWorld.visible = next !== 'hood';
    hoodWorld.visible = next === 'hood';
    ui.modeBtns.forEach((b) => {
      const on = b.dataset.mode === next;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    ui.buildBlock.hidden = next !== 'build';
    ui.hint.textContent = next === 'hood'
      ? '点击地板走动 · 点击邻居聊聊 · 点「回家」返回'
      : next === 'build'
        ? '选一件家具，再点地板放置 · Esc 取消'
        : '点击地板走动 · 点击物件互动 · 拖动旋转';
    if (next === 'build') renderShop();
    controls.minDistance = next === 'hood' ? 12 : 8;
    controls.maxDistance = next === 'hood' ? 46 : 38;
    flyTo(camPreset(next), 900);
    if (isNarrow()) {
      if (next === 'build') openSheet(); else closeSheet();
    }
    if (next === 'hood' && !hoodSeen) {
      hoodSeen = true;
      setTimeout(() => toast('🌿 邻里模式：点邻居聊聊，点「回家」的路牌返回', 'info'), 1000);
    }
  }

  /* ============================================================
   * 13. 拾取 / 点击 / 悬停
   * ============================================================ */
  function pickAt(cx, cy) {
    const rect = canvas.getBoundingClientRect();
    pointer.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const world = mode === 'hood' ? hoodWorld : homeWorld;
    const hits = raycaster.intersectObjects(world.children, true);
    for (const h of hits) {
      let o = h.object;
      while (o && o !== world) {
        if (o.userData && o.userData.pick) return { pick: o.userData.pick, point: h.point };
        o = o.parent;
      }
    }
    return null;
  }

  function pickLabel(p) {
    if (!p) return null;
    if (p.type === 'action') {
      const a = ACTIONS[p.key];
      if (a) return { icon: a.icon, text: a.name };
      if (p.key === 'door') return { icon: '🚪', text: '去邻里' };
    }
    if (p.type === 'decor') {
      const entry = S.placed.find((x) => x.id === p.id);
      const c = entry ? CATALOG[entry.kind] : null;
      if (c) return { icon: c.icon, text: c.name + (mode === 'build' ? ' · 点击选中' : '') };
    }
    if (p.type === 'neighbor') {
      const n = NEIGHBORS.find((x) => x.key === p.key);
      if (n) return { icon: n.icon, text: n.name + ' · 聊聊' };
    }
    if (p.type === 'self') return { icon: '🌿', text: 'Miri' };
    if (p.type === 'gate') return { icon: '🏠', text: '回家' };
    if (p.type === 'house') return { icon: '🏡', text: '小屋' };
    if (p.type === 'flavor') return { icon: '📌', text: '看看' };
    return null;
  }

  let hoverRaf = 0;
  let lastHover = null;
  function updateHover(cx, cy) {
    if (isNarrow() || placing) {
      ui.tip.hidden = true;
      return;
    }
    const hit = pickAt(cx, cy);
    let info = hit ? pickLabel(hit.pick) : null;
    if (!info && mode !== 'build') {
      const pt = floorPoint(cx, cy);
      const world = mode === 'hood' ? hoodWorld : homeWorld;
      const nav = mode === 'hood' ? navHood : navHome;
      if (pt && nav) {
        const local = world.worldToLocal(pt.clone());
        if (nav.contains(local.x, local.z)) info = { icon: '🐾', text: '走到这里' };
      }
    }
    if (!info) {
      ui.tip.hidden = true;
      canvas.style.cursor = 'grab';
      return;
    }
    ui.tipIcon.textContent = info.icon;
    ui.tipText.textContent = info.text;
    ui.tip.hidden = false;
    const tw = ui.tip.offsetWidth || 120;
    const th = ui.tip.offsetHeight || 28;
    ui.tip.style.left = Math.min(window.innerWidth - tw - 10, cx + 14) + 'px';
    ui.tip.style.top = Math.max(8, cy - th - 13) + 'px';
    canvas.style.cursor = 'pointer';
  }

  function handleClick(cx, cy) {
    if (placing) {
      tryPlaceAt(cx, cy);
      return;
    }
    const hit = pickAt(cx, cy);
    if (!hit) {
      if (mode !== 'build') {
        if (!moveToPoint(cx, cy)) closeCard();
        return;
      }
      closeCard();
      deselect();
      return;
    }
    const p = hit.pick;
    if (mode === 'build') {
      if (p.type === 'decor') {
        selectDecor(p.id);
      } else if (p.type === 'action' || p.type === 'gate' || p.type === 'door') {
        toast('建造模式下先专心布置房间吧');
      }
      return;
    }
    if (p.type === 'action') {
      if (p.key === 'door') openAction('door');
      else openAction(p.key);
    } else if (p.type === 'decor') {
      runDecorAction(p.id);
    } else if (p.type === 'neighbor') {
      openNeighbor(p.key);
    } else if (p.type === 'self') {
      openSelf();
    } else if (p.type === 'gate') {
      setMode('life');
      toast('🏠 回到家，暖灯还亮着');
    } else if (p.type === 'house' || p.type === 'flavor') {
      toast(p.note || '这里很安静。');
    }
  }

  /* ============================================================
   * 14. 事件绑定
   * ============================================================ */
  let downPoint = null;

  function bindEvents() {
    ui.modeBtns.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

    ui.bar.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cam]');
      if (!b) return;
      const act = b.dataset.cam;
      if (act === 'left') orbit(Math.PI / 4);
      else if (act === 'right') orbit(-Math.PI / 4);
      else if (act === 'in') zoomBy(0.85);
      else if (act === 'out') zoomBy(1.18);
      else if (act === 'reset') flyTo(camPreset(mode), 650);
      else if (act === 'panel') {
        if (ui.sidePanel.classList.contains('open')) closeSheet(); else openSheet();
      }
    });

    ui.saveChip.addEventListener('click', () => {
      saveState('manual');
      toast('已保存到本地', 'save');
    });

    const identity = document.getElementById('miriIdentity');
    if (identity) {
      identity.addEventListener('click', () => openSelf());
      identity.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openSelf();
        }
      });
    }

    ui.acClose.addEventListener('click', closeCard);
    ui.buildCancel.addEventListener('click', cancelPlacing);

    ui.relList.addEventListener('click', (e) => {
      const b = e.target.closest('[data-visit]');
      if (!b) return;
      const key = b.dataset.visit;
      if (mode !== 'hood') {
        setMode('hood');
        closeSheet();
        setTimeout(() => openNeighbor(key), 950);
      } else {
        openNeighbor(key);
      }
    });

    ui.shopList.addEventListener('click', (e) => {
      const b = e.target.closest('[data-kind]');
      if (!b) return;
      const kind = b.dataset.kind;
      const c = CATALOG[kind];
      if (placing && placing.kind === kind && !placing.moveId) {
        cancelPlacing();
        return;
      }
      if (S.coins < c.price) {
        toast(`🪙 金币不够，还差 ${c.price - S.coins}`, 'warn');
        return;
      }
      startPlacing(kind);
    });

    ui.decorOps.addEventListener('click', (e) => {
      const b = e.target.closest('[data-decor]');
      if (!b) return;
      if (b.dataset.decor === 'move') {
        const entry = S.placed.find((p) => p.id === selectedId);
        if (entry) startPlacing(entry.kind, entry.id);
      } else if (b.dataset.decor === 'sell') {
        sellSelected();
      }
    });

    let resetArmed = false;
    let resetTimer = 0;
    ui.resetBtn.addEventListener('click', () => {
      if (!resetArmed) {
        resetArmed = true;
        ui.resetBtn.textContent = '再点一次，确认重置';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          resetArmed = false;
          ui.resetBtn.textContent = '重置存档';
        }, 4200);
        return;
      }
      resetting = true;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      window.location.reload();
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (camTween) {
        camTween = null;
        controls.enabled = true;
        controls.update();
      }
      if (ui.sidePanel.classList.contains('open') && isNarrow()) closeSheet();
      downPoint = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      ui.tip.hidden = true;
      if (placing) updateGhost(e.clientX, e.clientY);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (placing) {
        updateGhost(e.clientX, e.clientY);
        return;
      }
      if (e.pointerType !== 'mouse') return;
      lastHover = { x: e.clientX, y: e.clientY };
      if (!hoverRaf) {
        hoverRaf = requestAnimationFrame(() => {
          hoverRaf = 0;
          if (lastHover) updateHover(lastHover.x, lastHover.y);
        });
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!downPoint || e.pointerId !== downPoint.id) return;
      const dx = e.clientX - downPoint.x;
      const dy = e.clientY - downPoint.y;
      const quick = performance.now() - downPoint.t < 600;
      downPoint = null;
      if (!quick || Math.hypot(dx, dy) > 8) return;
      handleClick(e.clientX, e.clientY);
    });

    canvas.addEventListener('pointerleave', () => {
      downPoint = null;
      ui.tip.hidden = true;
      canvas.style.cursor = 'grab';
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (placing) cancelPlacing();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (placing) cancelPlacing();
        else if (!ui.actionCard.hidden) closeCard();
        else deselect();
        return;
      }
      if (e.key === '1') setMode('life');
      else if (e.key === '2') setMode('build');
      else if (e.key === '3') setMode('hood');
      else if (e.key === 'r' || e.key === 'R') orbit(Math.PI / 4);
      else if (e.key === 'b' || e.key === 'B') setMode('build');
    });

    let wasLandscape = window.innerWidth > window.innerHeight;
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.fov = w / h < 0.9 ? 46 : 36;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isNarrow() ? 1.75 : 2));
      const landscape = w > h;
      if (landscape !== wasLandscape) {
        wasLandscape = landscape;
        setTimeout(() => flyTo(camPreset(mode), 600), 80);
      }
    });

    if (narrowQuery.addEventListener) {
      narrowQuery.addEventListener('change', () => setTimeout(() => flyTo(camPreset(mode), 600), 80));
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) saveState('hidden');
    });
    window.addEventListener('pagehide', () => saveState('pagehide'));
  }

  /* ============================================================
   * 15. 循环与初始化
   * ============================================================ */
  const gameClock = new Clock();
  const DECAY = { hunger: 0.11, energy: 0.075, fun: 0.09, social: 0.05, hygiene: 0.045 };

  function tickNeeds(dt) {
    for (const k of Object.keys(DECAY)) {
      S.needs[k] = Math.max(0, S.needs[k] - DECAY[k] * dt);
    }
    const now = performance.now();
    for (const n of NEEDS) {
      const v = S.needs[n.key];
      if (v < 20 && (!lastWarn[n.key] || now - lastWarn[n.key] > 90000)) {
        lastWarn[n.key] = now;
        toast(`${n.icon} ${n.label}有点低了 · ${n.hint}`, 'warn');
      }
    }
  }

  function updateMotes() {
    for (const m of motes) {
      m.s.position.x = m.x + Math.sin(elapsed * m.sp + m.ph) * 0.16;
      m.s.position.y = m.y + Math.sin(elapsed * m.sp * 0.8 + m.ph) * 0.1;
      m.s.material.opacity = 0.28 + 0.22 * (0.5 + 0.5 * Math.sin(elapsed * 0.9 + m.ph));
    }
    for (const f of fireflies) {
      f.s.position.x = f.x + Math.sin(elapsed * f.sp + f.ph) * 0.6;
      f.s.position.y = f.y + Math.sin(elapsed * f.sp * 0.7 + f.ph * 1.3) * 0.3;
      f.s.material.opacity = 0.18 + 0.42 * (0.5 + 0.5 * Math.sin(elapsed * 1.4 + f.ph));
    }
  }

  function shortestAngle(from, to) {
    return ((to - from + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  }

  function updateActor(actor, dt) {
    const g = actor.group;
    if (!g) return;
    let moving = false;
    if (actor.path.length) {
      const p = actor.path[0];
      const dx = p.x - g.position.x;
      const dz = p.z - g.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.06) {
        actor.path.shift();
      } else {
        moving = true;
        const step = Math.min(dist, actor.speed * dt);
        g.position.x += dx / dist * step;
        g.position.z += dz / dist * step;
        const yaw = Math.atan2(dx, dz);
        g.rotation.y += shortestAngle(g.rotation.y, yaw) * Math.min(1, dt * 10);
      }
    }
    if (moving) actor.walkPhase += dt * 9;
    const swing = moving ? Math.sin(actor.walkPhase) * 0.55 : 0;
    const limbs = g.userData.limbs;
    if (limbs) {
      const k = Math.min(1, dt * 12);
      limbs.legL.rotation.x += (swing - limbs.legL.rotation.x) * k;
      limbs.legR.rotation.x += (-swing - limbs.legR.rotation.x) * k;
      limbs.armL.rotation.x += (-swing * 0.8 - limbs.armL.rotation.x) * k;
      limbs.armR.rotation.x += (swing * 0.8 - limbs.armR.rotation.x) * k;
    }
    if (moving) {
      g.position.y = Math.abs(Math.sin(actor.walkPhase * 2)) * 0.03;
    } else {
      g.position.y = Math.sin(elapsed * 2.1 + (g.userData.phase || 0)) * 0.012;
      if (actor.look) {
        const dx = actor.look.x - g.position.x;
        const dz = actor.look.z - g.position.z;
        if (Math.hypot(dx, dz) > 0.05) {
          const yaw = Math.atan2(dx, dz);
          g.rotation.y += shortestAngle(g.rotation.y, yaw) * Math.min(1, dt * 3.2);
        }
      }
    }
  }

  function updateMiri(dt) {
    updateActor(homeActor, dt);
    updateActor(hoodActor, dt);
  }

  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t += dt;
      if (e.ring) {
        const k = Math.min(1, e.t / e.life);
        e.ring.scale.setScalar(1 + k * 1.8);
        e.ring.material.opacity = 0.9 * (1 - k);
        if (k >= 1) {
          if (e.ring.parent) e.ring.parent.remove(e.ring);
          e.ring.geometry.dispose();
          e.ring.material.dispose();
          effects.splice(i, 1);
        }
        continue;
      }
      e.s.position.addScaledVector(e.v, dt);
      e.v.y -= 0.6 * dt;
      e.s.material.opacity = Math.max(0, 0.9 * (1 - e.t / e.life));
      if (e.t >= e.life) {
        scene.remove(e.s);
        e.s.material.dispose();
        effects.splice(i, 1);
      }
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const rawDt = gameClock.getDelta();
    const dt = Math.min(rawDt, 0.05);
    elapsed += dt;
    if (!document.hidden) {
      advanceTime(dt * 1.0);
      tickNeeds(dt);
    }
    updateCamera();
    updateMiri(Math.min(rawDt, 0.25));
    updateEffects(dt);
    updateMotes();
    uiTimer += dt;
    if (uiTimer > 0.25) {
      uiTimer = 0;
      updateNeedBars();
      renderHUD();
    }
    renderer.render(scene, camera);
  }

  function initCamera() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.fov = camera.aspect < 0.9 ? 46 : 36;
    camera.updateProjectionMatrix();
    const p = camPreset('life');
    camera.position.copy(p.pos);
    controls.target.copy(p.target);
    controls.update();
  }

  /* ============================================================
   * 16. 启动
   * ============================================================ */
  buildHome();
  buildHood();
  homeActor.group = miri;
  hoodActor.group = hoodMiri;

  obstacles.push(...fixedObstacles);

  selRing = new Mesh(new RingGeometry(0.42, 0.52, 36), new MeshBasicMaterial({
    color: 0xffc07a, transparent: true, opacity: 0.9, side: DoubleSide, depthWrite: false
  }));
  selRing.rotation.x = -Math.PI / 2;
  selRing.visible = false;
  homeWorld.add(selRing);

  for (const p of S.placed) spawnPlaced(p);
  rebuildHomeNav();
  navHood = createNav(HOOD_BOUNDS, hoodObstacles, 0.3);
  ensureActorWalkable(hoodActor, navHood);

  buildNeedRows();
  renderAll();
  bindEvents();
  initCamera();

  window.__miri = {
    get state() { return S; },
    get mode() { return mode; },
    setMode,
    doAction,
    social,
    save: () => saveState('manual'),
    cancelPlacing,
    camera,
    controls,
    renderer,
    scene,
    homeWorld,
    hoodWorld,
    homeActor,
    hoodActor,
    get navHome() { return navHome; },
    get navHood() { return navHood; },
    THREE
  };

  animate();

  setInterval(() => {
    if (!document.hidden) saveState('auto');
  }, 20000);

  if (!hadSave) {
    setTimeout(() => toast('☀️ 点击地板让米莉走动 · 点床/灶台/书桌互动 · 右下角 ☰ 查看目标', 'info'), 900);
  } else {
    setTimeout(() => toast('☁️ 已读取上次的自动保存', 'save'), 700);
  }
}
</script>
</body>
